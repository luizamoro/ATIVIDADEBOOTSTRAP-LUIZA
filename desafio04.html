</head>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">Meu Portfólio</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                <li class="nav-item"><a class="nav-link" href="desafio01.html">Desafio 1</a></li>

                <li class="nav-item"><a class="nav-link active" href="desafio04.html">Desafio 4</a></li>

            </ul>
        </div>

</nav>

<div class="container py-5">
    <div class="card p-4 mx-auto" style="max-width: 800px;">
        <h1 class="text-center mb-4">Agendamento de Serviço</h1>

        <form>
            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Nome completo</label>
                    <input type="text" class="form-control" placeholder="Digite seu nome" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-control" placeholder="seuemail@email.com" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Telefone</label>
                    <div class="input-group">
                        <span class="input-group-text">(41)</span>
                        <input type="tel" class="form-control" placeholder="99999-9999" required>
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Valor estimado</label>
                    <div class="input-group">
                        <span class="input-group-text">R$</span>
                        <input type="number" class="form-control" placeholder="0,00" min="0">
                    </div>
                </div>

            </div>

            <div class="mb-3">
                <label class="form-label">Tipo de serviço</label>
                <select class="form-select" required>
                    <option value="">Selecione um serviço</option>
                    <option>Manutenção</option>
                    <option>Instalação</option>
                    <option>Orçamento</option>
                    <option>Outro</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Descreva o que precisa</label>
                <textarea class="form-control" rows="4" placeholder="Digite os detalhes do serviço"></textarea>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" required id="termos">
                <label class="form-check-label" for="termos">
                    Concordo com o envio dos meus dados para atendimento.
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-100">Enviar solicitação</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
